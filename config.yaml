# Experiment configuration — edit this, not the code, to change a run.
seed: 42

data:
  source: synthetic        # "synthetic" (default) or "csv"
  csv_path: data/dataset.csv
  # positive_label: attack  # required for CSV labels other than 0/1; maps to class 1
  target: label            # target column name when source == csv
  n_samples: 2000          # synthetic only
  n_features: 20           # synthetic only
  test_size: 0.2

model:
  hidden_sizes: [64, 32]
  dropout: 0.1

train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001

output:
  dir: results
